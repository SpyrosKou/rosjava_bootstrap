/*
* @author Spyros Koukas 
*/

plugins {
   id 'application'
   id 'groovy'
}


application {
   mainClass = 'org.ros.catking_package_msg.JavaMsgGenerationManager'
}


dependencies {
   implementation 'org.slf4j:slf4j-api:1.7.30'
   implementation 'org.codehaus.groovy:groovy-all:3.'
   implementation project(":message_generation")
   implementation 'com.google.guava:guava:33.0.0-jre'
   implementation 'commons-io:commons-io:2.11.0'
   testImplementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.17.2'
   testImplementation 'org.apache.logging.log4j:log4j-core:2.17.2'
}

repositories{
   mavenCentral();
}
